<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - Karigar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container py-5 fade-in">
        <div class="row justify-content-center">
            <div class="col-lg-7 col-md-9">
                <div class="chat-glass-card shadow-soft border-radius-xl" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); box-shadow: 0 10px 30px rgba(50,205,50,0.10); border: none;">
                    <div class="d-flex align-items-center justify-content-between p-4 border-bottom" style="background: rgba(255,255,255,0.10); border-radius: 20px 20px 0 0;">
                        <div>
                            <span id="chatWith" class="fw-bold text-white" style="font-size: 1.3rem;"><i class="fas fa-comments me-2"></i>Chat with <span id="chatUserNameOrEmail" class="fw-bold text-white" style="color:#fff !important; opacity:1 !important;">User</span></span>
                        </div>
                        <div class="d-flex gap-2">
                            <a href="#" id="buyBtn" class="btn btn-success btn-sm"><i class="fas fa-shopping-cart"></i> Buy</a>
                            <a href="/" class="btn btn-primary btn-sm"><i class="fas fa-home"></i> Home</a>
                        </div>
                    </div>
                    <div class="p-4" id="chatMessages" style="height: 400px; overflow-y: auto; background: rgba(255,255,255,0.85); border-radius: 0 0 20px 20px;">
                        <!-- Messages will appear here -->
                    </div>
                    <div class="p-3 border-top bg-light" style="border-radius: 0 0 20px 20px;">
                        <form id="chatForm" class="d-flex gap-2 align-items-center">
                            <input type="text" id="chatInput" class="form-control border-radius-lg" placeholder="Type a message..." autocomplete="off" required style="background: rgba(255,255,255,0.95);">
                            <button type="submit" class="btn btn-success px-4 border-radius-lg"><i class="fas fa-paper-plane"></i></button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <style>
        body {
            background: linear-gradient(120deg, #e0eafc 0%, #cfdef3 100%);
            min-height: 100vh;
        }
        .chat-glass-card {
            background: rgba(102, 126, 234, 0.85);
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.18);
            border: 1.5px solid rgba(255,255,255,0.18);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            overflow: hidden;
        }
        #chatMessages {
            scrollbar-width: thin;
            scrollbar-color: #32CD32 #e0eafc;
            background: rgba(255,255,255,0.85);
            border-radius: 0 0 24px 24px;
            padding-bottom: 1.5rem;
        }
        #chatMessages::-webkit-scrollbar {
            width: 8px;
        }
        #chatMessages::-webkit-scrollbar-thumb {
            background: #32CD32;
            border-radius: 10px;
        }
        #chatMessages::-webkit-scrollbar-track {
            background: #e0eafc;
            border-radius: 10px;
        }
        .chat-bubble {
            display: block;
            padding: 0.7rem 1.2rem;
            border-radius: 18px;
            margin-bottom: 0.5rem;
            max-width: 70%;
            font-size: 1.05rem;
            box-shadow: 0 2px 12px rgba(50,205,50,0.10);
            word-break: break-word;
            transition: background 0.2s, color 0.2s;
            clear: both;
        }
        .chat-bubble.me {
            background: linear-gradient(135deg, #32CD32 0%, #28a745 100%);
            color: #fff;
            margin-left: auto;
            margin-right: 0;
            text-align: right;
            font-weight: 500;
            float: right;
            border-bottom-right-radius: 6px;
        }
        .chat-bubble.them {
            background: rgba(255,255,255,0.98);
            color: #333;
            margin-right: auto;
            margin-left: 0;
            text-align: left;
            border: 1.5px solid #e0eafc;
            float: left;
            border-bottom-left-radius: 6px;
        }
        #chatMessages {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }
        #chatForm {
            background: rgba(255,255,255,0.92);
            border-radius: 0 0 20px 20px;
            box-shadow: 0 2px 8px rgba(50,205,50,0.04);
            padding: 0.5rem 0.75rem;
        }
        #chatInput {
            border-radius: 16px;
            border: 1.5px solid #b0c4de;
            font-size: 1.05rem;
            padding: 0.7rem 1.1rem;
            background: rgba(255,255,255,0.98);
            box-shadow: none;
            transition: border 0.2s;
        }
        #chatInput:focus {
            border: 1.5px solid #32CD32;
            outline: none;
        }
        .btn-success {
            background: linear-gradient(90deg, #32CD32 0%, #28a745 100%);
            border: none;
            border-radius: 14px;
            font-weight: 500;
            box-shadow: 0 2px 8px rgba(50,205,50,0.10);
            transition: background 0.2s, box-shadow 0.2s;
        }
        .btn-success:hover, .btn-success:focus {
            background: linear-gradient(90deg, #28a745 0%, #32CD32 100%);
            box-shadow: 0 4px 16px rgba(50,205,50,0.18);
        }
        .btn-primary {
            background: linear-gradient(90deg, #764ba2 0%, #667eea 100%);
            border: none;
            border-radius: 14px;
            font-weight: 500;
            box-shadow: 0 2px 8px rgba(102,126,234,0.10);
            transition: background 0.2s, box-shadow 0.2s;
        }
        .btn-primary:hover, .btn-primary:focus {
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 4px 16px rgba(102,126,234,0.18);
        }
        .fade-in {
            animation: fadeIn 0.7s cubic-bezier(0.4,0,0.2,1);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: none; }
        }
        @media (max-width: 600px) {
            .chat-glass-card { border-radius: 12px; }
            #chatMessages { border-radius: 0 0 12px 12px; }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
    <script>
    // Set chat user name/email in the header
    const urlParams = new URLSearchParams(window.location.search);
    const chatWith = urlParams.get('user');
    const chatUserNameOrEmail = document.getElementById('chatUserNameOrEmail');
    if (chatWith) {
        // Try to fetch the user's name from the backend
        fetch(`/api/profile?email=${encodeURIComponent(chatWith)}`)
            .then(res => res.json())
            .then(data => {
                if (data.success && data.user && data.user.name) {
                    chatUserNameOrEmail.textContent = data.user.name;
                } else {
                    chatUserNameOrEmail.textContent = chatWith;
                }
            })
            .catch(() => {
                chatUserNameOrEmail.textContent = chatWith;
            });
    }
    // Buy button click (customize as needed)
    document.getElementById('buyBtn').addEventListener('click', function(e) {
        e.preventDefault();
        alert('Buy functionality coming soon!');
    });
    </script>
</body>
</html>
